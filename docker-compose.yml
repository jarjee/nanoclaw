services:
  nanoclaw:
    build: .
    restart: unless-stopped

    # .env is loaded two ways:
    #   1. env_file injects all vars into process.env (picked up by config.ts fallbacks)
    #   2. The file is also bind-mounted at /app/.env so readEnvFile() works as on bare-metal
    env_file: .env

    cap_add:
      - SYS_PTRACE # gVisor ptrace mode: intercepts subagent syscalls without KVM

    # Uncomment to enable gVisor KVM mode (faster ~2x, requires /dev/kvm on the host):
    #   Also set GVISOR_PLATFORM=kvm in .env or environment below.
    # devices:
    #   - /dev/kvm

    # Uncomment to switch to bubblewrap (namespace isolation, needs SYS_ADMIN instead):
    # cap_add:
    #   - SYS_ADMIN
    # environment:
    #   - CONTAINER_RUNTIME=bwrap

    volumes:
      # Persistent group memory (CLAUDE.md files, per-group state)
      - ./groups:/app/groups
      # Persistent sessions (.claude/), IPC state, container logs
      - ./data:/app/data
      # Secrets file — readEnvFile() reads this directly from disk
      - ./.env:/app/.env:ro

    # Unraid users: add --cap-add=SYS_PTRACE to "Extra Parameters" in the
    # container template. For KVM mode also add --device /dev/kvm.
